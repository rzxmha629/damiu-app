<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{font-family:Arial;background:#f0f2f5;padding:10px;}
.card{background:#fff;padding:15px;margin:10px 0;border-radius:10px;}
button{padding:12px;width:100%;margin-top:10px;}
input, select{width:100%;padding:10px;margin-top:5px;}
.hidden{display:none;}
.section{margin-top:10px;border:1px solid #ddd;border-radius:8px;}
.section h4{margin:0;padding:10px;background:#eee;cursor:pointer;}
.section .content{display:none;padding:10px;}
</style>
</head>

<body>

<h2>INSPEKSI DAMIU</h2>

<div class="card" id="loginBox">
<input id="user" placeholder="username">
<input id="pass" type="password" placeholder="password">
<button onclick="login()">Login</button>
</div>

<div class="card hidden" id="form">

<input id="nama_dam" placeholder="Nama DAM">

<!-- SECTION A -->
<div class="section">
<h4 onclick="toggle(this)">A. LOKASI</h4>
<div class="content">

<label>Bebas banjir</label>
<select id="A1"><option value="0">Ya</option><option value="3">Tidak</option></select>

<label>Pencemaran</label>
<select id="A2"><option value="0">Tidak</option><option value="1">Ada</option></select>

<label>Vektor</label>
<select id="A3"><option value="0">Tidak</option><option value="3">Ada</option></select>

</div>
</div>

<!-- SECTION B -->
<div class="section">
<h4 onclick="toggle(this)">B. BANGUNAN</h4>
<div class="content">

<label>Bahan kuat</label>
<select id="B1a"><option value="0">Ya</option><option value="1">Tidak</option></select>

<label>Mudah dibersihkan</label>
<select id="B1b"><option value="0">Ya</option><option value="1">Tidak</option></select>

</div>
</div>

<button onclick="kirim()">SIMPAN</button>

</div>

<script>

const SUPABASE_URL = "https://rvtpnqhyjmcxdqtotzyf.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2dHBucWh5am1jeGRxdG90enlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4NTY1NzIsImV4cCI6MjA5MDQzMjU3Mn0.44ClXNFfy4QYFlpTAKK63sDKRC3QPYFf7mKO25aPqXE";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = "";

// AUTO QR DETECT
window.onload = function(){
  const params = new URLSearchParams(window.location.search);
  const depot = params.get("depot");

  if(depot){
    document.getElementById("nama_dam").value = depot;
  }
}

// LOGIN
async function login(){
  const { data } = await client
    .from('users')
    .select('*')
    .eq('username', user.value)
    .eq('password', pass.value);

  if(data.length){
    currentUser = data[0].username;
    loginBox.classList.add("hidden");
    form.classList.remove("hidden");
  }else{
    alert("Login gagal");
  }
}

// TOGGLE UI
function toggle(el){
  let content = el.nextElementSibling;
  content.style.display =
    content.style.display === "block" ? "none" : "block";
}

// HITUNG
function hitung(){
  let total =
    parseInt(A1.value) +
    parseInt(A2.value) +
    parseInt(A3.value);

  let nilai = 100 - ((total/165)*100);
  let status = nilai >= 70 ? "LAIK" : "TIDAK LAIK";

  return {total, nilai: Math.round(nilai), status};
}

// SIMPAN
async function kirim(){

  let h = hitung();

  await client.from('inspeksi').insert([{
    nama_dam: nama_dam.value,
    A1: parseInt(A1.value),
    A2: parseInt(A2.value),
    A3: parseInt(A3.value),
    B1a: parseInt(B1a.value),
    B1b: parseInt(B1b.value),
    total: h.total,
    nilai: h.nilai,
    status: h.status,
    petugas: currentUser
  }]);

  alert("Nilai: "+h.nilai+" | "+h.status);
}

</script>

</body>
</html>
