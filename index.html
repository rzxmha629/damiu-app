<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{font-family:Arial;background:#f0f2f5;padding:10px;}
.card{background:#fff;padding:15px;margin:10px 0;border-radius:10px;}
button{padding:12px;width:100%;margin-top:10px;}
input{width:100%;padding:10px;margin-top:5px;}
.hidden{display:none;}
.section{margin-top:10px;border:1px solid #ddd;border-radius:8px;}
.section h4{margin:0;padding:10px;background:#eee;cursor:pointer;}
.section .content{display:none;padding:10px;}
.good{color:green;font-weight:bold;}
.bad{color:red;font-weight:bold;}
</style>
</head>

<body>

<h2>SISTEM INSPEKSI DAMIU</h2>

<!-- LOGIN -->
<div class="card" id="loginBox">
<input id="user" placeholder="username">
<input id="pass" type="password" placeholder="password">
<button onclick="login()">Login</button>
</div>

<!-- MENU -->
<div class="card hidden" id="menu">
<div id="menuContent"></div>
</div>

<!-- FORM -->
<div class="card hidden" id="form">

<h3>FORMULIR INSPEKSI KESEHATAN LINGKUNGAN</h3>
<h4>DEPOT AIR MINUM</h4>

<label>Nama DAM</label>
<input id="nama_dam">

<label>Alamat</label>
<input id="alamat">

<label>Nama Pemilik</label>
<input id="pemilik_nama">

<label>Tanggal Inspeksi</label>
<input type="date" id="tanggal">

<hr>

<div class="section">
<h4 onclick="toggle(this)">A. LOKASI</h4>
<div class="content">
<label><input type="checkbox" id="A1" value="3"> Tidak bebas banjir</label><br>
<label><input type="checkbox" id="A2" value="1"> Tercemar</label><br>
<label><input type="checkbox" id="A3" value="1"> Ada vektor</label>
</div>
</div>

<div class="section">
<h4 onclick="toggle(this)">B. BANGUNAN</h4>
<div class="content">
<label><input type="checkbox" id="B1a" value="1"> Bahan tidak kuat</label><br>
<label><input type="checkbox" id="B1b" value="1"> Tidak mudah dibersihkan</label><br>
<label><input type="checkbox" id="B1c" value="1"> Retak/sarang vektor</label>
</div>
</div>

<div class="section">
<h4 onclick="toggle(this)">Upload Foto Temuan</h4>
<div class="content">
<input type="file" id="foto">
</div>
</div>

<button onclick="kirim()">SIMPAN INSPEKSI</button>

</div>

<!-- DASHBOARD -->
<div class="card hidden" id="dashboard">
<h3>Dashboard</h3>
<canvas id="chart"></canvas>
<div id="ranking"></div>
<div id="riwayat"></div>
</div>

<!-- PEMILIK -->
<div class="card hidden" id="pemilik">
<h3>Status Depot</h3>
<div id="statusDepot"></div>
</div>

<script>

const SUPABASE_URL = "https://rvtpnqhyjmcxdqtotzyf.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2dHBucWh5am1jeGRxdG90enlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4NTY1NzIsImV4cCI6MjA5MDQzMjU3Mn0.44ClXNFfy4QYFlpTAKK63sDKRC3QPYFf7mKO25aPqXE";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser="";
let currentRole="";
let chartInstance=null;

// QR AUTO
window.onload = function(){
  const params = new URLSearchParams(window.location.search);
  const depot = params.get("depot");
  if(depot) nama_dam.value = depot;
}

// LOGIN
async function login(){
  const { data } = await client
    .from('users')
    .select('*')
    .eq('username', user.value)
    .eq('password', pass.value);

  if(data.length){
    currentUser = data[0].username;
    currentRole = data[0].role;

    loginBox.classList.add("hidden");
    menu.classList.remove("hidden");

    loadMenu();

    if(currentRole==="admin") showPage("dashboard");
    if(currentRole==="petugas") showPage("form");
    if(currentRole==="pemilik") showPage("pemilik");

  }else{
    alert("Login gagal");
  }
}

// MENU
function loadMenu(){
  let html="";

  if(currentRole==="admin"){
    html += `<button onclick="showPage('dashboard')">Dashboard</button>`;
    html += `<button onclick="exportPDF()">Export PDF</button>`;
  }

  if(currentRole==="petugas"){
    html += `<button onclick="showPage('form')">Form Inspeksi</button>`;
  }

  if(currentRole==="pemilik"){
    html += `<button onclick="showPage('pemilik')">Status</button>`;
  }

  menuContent.innerHTML = html;
}

// NAV
function showPage(p){
  form.classList.add("hidden");
  dashboard.classList.add("hidden");
  pemilik.classList.add("hidden");

  if(p==="form") form.classList.remove("hidden");
  if(p==="dashboard"){dashboard.classList.remove("hidden");loadDashboard();}
  if(p==="pemilik"){pemilik.classList.remove("hidden");loadPemilik();}
}

// TOGGLE
function toggle(el){
  let c = el.nextElementSibling;
  c.style.display = c.style.display==="block"?"none":"block";
}

// CHECK VALUE
function getNilai(id){
  return document.getElementById(id).checked 
    ? parseInt(document.getElementById(id).value) 
    : 0;
}

// HITUNG
function hitung(){
  let total =
    getNilai("A1") +
    getNilai("A2") +
    getNilai("A3") +
    getNilai("B1a") +
    getNilai("B1b") +
    getNilai("B1c");

  let nilai = 100 - ((total/165)*100);
  let status = nilai>=70?"LAIK":"TIDAK LAIK";

  return {total,nilai:Math.round(nilai),status};
}

// UPLOAD FOTO
async function uploadFoto(file){

  const fileName = Date.now()+"_"+file.name;

  const { error } = await client.storage
    .from('foto')
    .upload(fileName, file);

  if(error){
    alert(error.message);
    return null;
  }

  const { data } = client.storage
    .from('foto')
    .getPublicUrl(fileName);

  return data.publicUrl;
}

// SIMPAN
async function kirim(){

  if(currentRole!=="petugas"){
    alert("Hanya petugas!");
    return;
  }

  let h = hitung();

  let fotoUrl=null;

  if(foto.files[0]){
    fotoUrl = await uploadFoto(foto.files[0]);
  }

  await client.from('inspeksi').insert([{
    nama_dam:nama_dam.value,
    alamat:alamat.value,
    pemilik:pemilik_nama.value,
    tanggal:tanggal.value,
    A1:getNilai("A1"),
    A2:getNilai("A2"),
    A3:getNilai("A3"),
    B1a:getNilai("B1a"),
    B1b:getNilai("B1b"),
    B1c:getNilai("B1c"),
    foto:fotoUrl,
    total:h.total,
    nilai:h.nilai,
    status:h.status,
    petugas:currentUser,
    created_at:new Date()
  }]);

  alert("Berhasil | Nilai: "+h.nilai);

  document.querySelectorAll("input[type=checkbox]").forEach(c=>c.checked=false);
}

// DASHBOARD
async function loadDashboard(){

  const { data } = await client.from('inspeksi').select('*');

  let latest={};

  data.forEach(d=>{
    if(!latest[d.nama_dam] || new Date(d.created_at)>new Date(latest[d.nama_dam].created_at)){
      latest[d.nama_dam]=d;
    }
  });

  let finalData = Object.values(latest);
  finalData.sort((a,b)=>b.nilai-a.nilai);

  let html="<h4>Ranking Depot</h4>";

  finalData.forEach((d,i)=>{
    let warna = d.nilai>=70?"good":"bad";
    html += `<p class="${warna}">${i+1}. ${d.nama_dam} - ${d.nilai}</p>`;
  });

  ranking.innerHTML = html;

  if(chartInstance) chartInstance.destroy();

  chartInstance = new Chart(chart,{
    type:"bar",
    data:{
      labels:finalData.map(d=>d.nama_dam),
      datasets:[{label:"Nilai",data:finalData.map(d=>d.nilai)}]
    }
  });

  loadRiwayat();
}

// RIWAYAT
async function loadRiwayat(){

  const { data } = await client
    .from('inspeksi')
    .select('*')
    .order('created_at',{ascending:false});

  let html="<h4>Riwayat Inspeksi</h4>";

  data.forEach(d=>{
    html += `
    <div class="card">
      <b>${d.nama_dam}</b><br>
      Nilai: ${d.nilai} (${d.status})<br>
      Petugas: ${d.petugas}<br>
      ${d.foto ? `<img src="${d.foto}" width="100">` : ""}
    </div>`;
  });

  riwayat.innerHTML = html;
}

// PEMILIK
async function loadPemilik(){

  const { data } = await client
    .from('inspeksi')
    .select('*')
    .eq('nama_dam', currentUser);

  if(!data.length){
    statusDepot.innerHTML="Belum ada data";
    return;
  }

  let d = data[data.length-1];
  let warna = d.nilai>=70?"good":"bad";

  statusDepot.innerHTML=`
  <p>${d.nama_dam}</p>
  <p class="${warna}">Nilai: ${d.nilai}</p>
  <p>${d.status}</p>
  ${d.foto ? `<br><img src="${d.foto}" width="120">` : ""}`;
}

// PDF
function exportPDF(){

  let original = document.body.innerHTML;

  let isi = `
  <h2>LAPORAN INSPEKSI DAMIU</h2>
  <p>${new Date().toLocaleString()}</p>
  ${dashboard.innerHTML}
  `;

  document.body.innerHTML = isi;

  window.print();

  document.body.innerHTML = original;
  location.reload();
}

</script>

</body>
</html>
