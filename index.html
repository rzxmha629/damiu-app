<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{font-family:Arial;background:#f5f5f5;padding:15px;}
.card{background:#fff;padding:15px;margin:10px 0;border-radius:10px;}
button{padding:12px;width:100%;margin-top:10px;}
input, select{width:100%;padding:10px;margin-top:5px;}
.hidden{display:none;}
</style>
</head>

<body>

<h2>DAMIU SYSTEM</h2>

<!-- LOGIN -->
<div class="card" id="loginBox">
<h3>Login</h3>
<input id="user" placeholder="username">
<input id="pass" type="password" placeholder="password">
<button onclick="login()">LOGIN</button>
</div>

<!-- APP -->
<div class="card hidden" id="app">

<h3>Form Inspeksi</h3>

<input id="nama_dam" placeholder="Nama DAM">

<label>A1 Banjir</label>
<select id="A1">
<option value="0">Sesuai</option>
<option value="3">Tidak</option>
</select>

<label>A2 Pencemaran</label>
<select id="A2">
<option value="0">Sesuai</option>
<option value="1">Tidak</option>
</select>

<label>A3 Vektor</label>
<select id="A3">
<option value="0">Tidak</option>
<option value="3">Ada</option>
</select>

<button onclick="kirim()">Kirim Data</button>

</div>

<script>

// 🔥 GANTI INI DENGAN PUNYA KAMU
const SUPABASE_URL = "https://rvtpnqhyjmcxdqtotzyf.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2dHBucWh5am1jeGRxdG90enlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4NTY1NzIsImV4cCI6MjA5MDQzMjU3Mn0.44ClXNFfy4QYFlpTAKK63sDKRC3QPYFf7mKO25aPqXE";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ================= LOGIN =================
async function login(){
  const username = document.getElementById("user").value.trim();
  const password = document.getElementById("pass").value.trim();

  const { data, error } = await client
    .from('users')
    .select('*')
    .eq('username', username)
    .eq('password', password);

  console.log(data, error);

  if(error){
    alert("Error: " + error.message);
    return;
  }

  if(data.length > 0){
    alert("Login berhasil");
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
  }else{
    alert("Username / Password salah");
  }
}

// ================= SIMPAN =================
async function kirim(){
  const { error } = await client
    .from('inspeksi')
    .insert([{
      nama_dam: document.getElementById("nama_dam").value,
      A1: parseInt(document.getElementById("A1").value),
      A2: parseInt(document.getElementById("A2").value),
      A3: parseInt(document.getElementById("A3").value),
      petugas: document.getElementById("user").value
    }]);

  if(error){
    alert("Gagal simpan: " + error.message);
  }else{
    alert("Data berhasil disimpan");
  }
}

</script>

</body>
</html>
